<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>heartslides</title>
    <script type="text/javascript" src="js/editor.bundle.js"></script>
    <script type="text/javascript" src="js/jszip.min.js"></script>
    <script type="text/javascript" src="js/dom-to-image.js"></script>
    <script type="text/javascript" src="js/highlight/highlight.min.js"></script>
    <script type="text/javascript" src="js/highlight/javascript.min.js"></script>
    <script type="text/javascript" src="js/highlight/css.min.js"></script>
    <script type="text/javascript" src="js/highlight/bash.min.js"></script>
    <script type="text/javascript" src="js/highlight/shell.min.js"></script>
    <script type="text/javascript" src="js/highlight/python.min.js"></script>
    <script type="text/javascript" src="js/highlight/typescript.min.js"></script>
    <script type="text/javascript" src="js/highlight/diff.min.js"></script>
    <script type="text/javascript" src="js/highlight/hljs-patches.js"></script>
    <link rel="stylesheet" type="text/css" href="js/highlight/night-owl.min.css">
    <style>
@property --cqw {
  syntax: '<length>';
  inherits: true;
  initial-value: 1cqw;
}
@property --cqh {
  syntax: '<length>';
  inherits: true;
  initial-value: 1cqh;
}
        html, body, .slide-editor {
            width: 100%;
            height: 100%;
            margin: 0;
        }
        .slide-editor {
            display: grid;
            grid-template:
                "top top top top" 32px
                "slides code preview preview" 1fr
                "slides code preview preview" 1fr
                "bottom bottom bottom bottom" 32px / 148px 50% auto 100px;
        }
        slides-aside {
            grid-area: slides;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            overflow-x: clip;
            scrollbar-width: thin;
            padding-bottom: 10px;
        }
        slides-preview {
            border: 1px solid #EEE;
            container-type: inline-size;
            grid-area: preview;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: clip;
            & > div {
                --cqw: 100cqw;
                --cqh: 100cqh;
                width: 0px;
                height: 0px;
                flex-grow: 0;
                & > div {
                    /* https://screen-share.github.io/element-capture/#elements-eligible-for-restriction */
                    isolation: isolate;
                    transform-style: flat;

                    display: flex;
                    width: 768px;
                    height: 432px;
                    translate: -50% -50%;
                    scale: calc((tan(atan2(var(--cqw), 1px)) - 32) / 768);
                    outline: 2px solid orange;
                    position: absolute;
                    overflow: clip;
                    & > .global {
                        display: none;
                    }
                    & > .body {
                        display: inline-block;
                        flex-grow: 1;
                        /* width: 768px;  */
                        /* height: 432px; */
                    }
                }
            }
        }
        slide-list-item, slide-list-add {
            position: relative;
            flex-shrink: 0;
            background-size: cover;
            cursor: pointer;
            display: flex;
            outline: 2px solid #888;
            gap: 2px;
            width: 128px;
            height: 72px;
            margin-top: 8px;
            color: #000;
            text-shadow: 1px 1px #FFF;
            &:first-child {
                height: 1lh;
            }
            &:is(slide-list-add) {
               text-align: center;
               align-content: center;
               height: 2lh
            }
            &:hover {
                background-color: #8884;
            }
            &.selected {
                background-color: #88F2;
                outline-color: #88F;
            }
            &:not(:hover) {
                slide-list-action { display:none; }
            }
            slide-list-action {
                background: #FFF;
                &:hover {
                    background: #EEE;
                }
                &:first-child {
                    margin-left: auto;
                }
                align-self: end;
                display: block;
                width: 16px;
                height: 16px;
                border: 1px solid;
                text-align: center;
            }
        }
        slide-list-item.dragTarget {
            &::after {
                content: "";
                position: absolute;
                top: -5px;
                left:0;
                right:0;
                height: 2px;
                background: #44F;
                box-shadow: 0 0 4px 2px #44F8;
                z-index: 1;
            }
        }
        #editorDiv {
            grid-area: code;
            & > div {
                height: 100%;
            }
        }
        [data-code-selected] {
            /* rebeccapurple  */
            outline: 1px solid #00ff76;
            background: rgb(from #00ff76 r g b / 0.2);
        }
        [data-code-hover-highlight] {
            outline: 1px solid hotpink;
            background: rgb(from hotpink r g b / 0.2);
        }
        /* note: this currently needs polyfill for firefox */
        [data-abs-x] {
            position: absolute;
            left: var(--data-abs-x);
            left: attr(data-abs-x px);
        }
        [data-abs-y] {
            position: absolute;
            top: var(--data-abs-y);
            top: attr(data-abs-y px);
        }
        [data-abs-s] {
            scale: var(--data-abs-s);
            scale: attr(data-abs-s %);
        }
        [data-abs-r] {
            rotate: var(--data-abs-r);
            rotate: attr(data-abs-r deg);
        }
        .starting-style {
            transition: none!important;
        }


        lite-bar {
            display: none;
            grid-area: litebar;
            flex-direction: column;
            box-sizing: border-box;
            gap: 16px;
            padding: 16px;
            button {
                font-size: 200%;
                padding: 8px 16px;
                cursor: pointer;
            }
        }
        body:has(#lite-mode:checked):not(.presenting) {
            .slide-editor {
                grid-template:
                    "top top top top" 32px
                    "slides preview preview litebar" 1fr
                    "slides preview preview litebar" 1fr
                    "bottom bottom bottom bottom" 32px / 148px 50% auto 400px;
            }
            #editorDiv {
                display: none;
            }
            lite-bar {
                display: flex;
            }
        }

        body.presenting {
            .slide-editor {
                display: grid;
                grid-template:
                    "preview" 1fr / 1fr;
                &>:not(slides-preview) {
                    display: none;
                }
                slides-preview {
                    border: none;
                    & > div > div {
                        scale: min(calc((tan(atan2(var(--cqw), 1px))) / 768), calc((tan(atan2(var(--cqh), 1px))) / 432));
                        outline: none;
                    }
                }
            }
        }

        .highlighted-pre {
            overflow: visible;
            font-size: 0.8em;
            white-space: pre-wrap;
        }

        slides-top {
            display: flex;
            color: white;
            align-items: center;
            gap: 8px;
            &>span:first-child {
                margin-left: 8px;
            }
            button {
                background: none;
                color: #FFF;
                border: 1px solid #FFF;
                cursor:pointer;
                &:hover {
                    color: green;
                    background: #FFF;
                }
            }
        }

        slides-bottom {
            display: flex;
            color: green;
            align-items: center;
            gap: 8px;
            &>span:first-child {
                margin-left: 8px;
            }
        }

        slides-overlay {
            position: fixed;
            bottom: 16px;
            left: 16px;
            border-radius: 8px;
            display: flex;
            font-size: 175%;
            user-select: none;
            button {
                border: none;
                background: none;
                font-size: inherit;
                border-radius: inherit;
                cursor: pointer;
                &:hover {
                    background: #FFFE;
                }
            }
            background: #FFF4;
            z-index: 100;
        }
    </style>
</head>
<body>
<main class="slide-editor">
    <p style="position:absolute;top:50%;left:50%;translate:-50% -50%;font-size:128px;margin: 0;z-index:10;" id="slides-loading">Loading...</p>
    <slides-top style="background: green;grid-area: top">
        <span>heartslides</span>
        <button onclick=saveProject()>Save Project</button>
        <button onclick=openProjectZip()>Open Project Zip</button>
        <button onclick=downloadProjectZip()>Save Project Zip</button>
        <button onclick=exportProject()>Export Project HTML</button>
        <button onclick=resetZoom()>Reset Zoom</button>
        <button onclick=togglePresenting()>Present</button>
        <button onclick=openPresenterView()>Presenter View</button>
        <label><input type="checkbox" name="lite-mode" id="lite-mode">view-only mode</label>
    </slides-top>
    <slides-aside>
        
    </slides-aside>
    <div id="editorDiv"></div>
    <slides-preview>
        <div>
            <div>
                <span class="global"></span>
                <div class="body">
                </div>
            </div>
        </div>
    </slides-preview>
    <lite-bar>
        <p style="font-size:64px;margin:0;text-align:center;">Actions</p>
        <button onclick=togglePresenting()>Present</button>
        <button onclick=togglePresenting(true)>Present (no fullscreen)</button>
        <button onclick=openPresenterView()>Presenter View</button>
        <div style="display:flex;gap:inherit"><button style="flex:1" onclick=prevSlideSoft()>Prev</button><button style="flex:1" onclick=nextSlideSoft()>Next</button></div>
        <div style="flex:1"></div>
        <note-area></note-area>
    </lite-bar>
    <slides-bottom style="background: pink;grid-area: bottom"><span>lyra rebane</span></slides-bottom>
</main>
<slides-overlay style="display:none"><button onclick=prevSlideSoft()>&lt;</button><button onclick=nextSlideSoft()>&gt;</button><button onclick=togglePresenting()>X</button></slides-overlay>
<script type="text/javascript" src="js/main.js"></script>
</body>
</html>
