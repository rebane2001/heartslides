<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>heartslides</title>
    <script type="text/javascript" src="bundling/editor.bundle.js"></script>
    <style>
@property --cqw {
  syntax: '<length>';
  inherits: true;
  initial-value: 1cqw;
}
@property --cqh {
  syntax: '<length>';
  inherits: true;
  initial-value: 1cqh;
}
        html, body, .slide-editor {
            width: 100%;
            height: 100%;
            margin: 0;
        }
        .slide-editor {
            display: grid;
            grid-template:
                "top top top top" 32px
                "slides code preview preview" 1fr
                "bottom bottom bottom bottom" 32px / 100px 40% auto 100px;
        }
        slides-aside {
            grid-area: slides;
        }
        slides-preview {
            border: 1px solid #EEE;
            container-type: inline-size;
            grid-area: preview;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: clip;
            & > div {
                --cqw: 100cqw;
                width: 0px;
                height: 0px;
                flex-grow: 0;
                & > div {
                    width: 1920px;
                    height: 1080px;
                    translate: -50% -50%;
                    scale: calc((tan(atan2(var(--cqw), 1px)) - 32) / 1920);
                    outline: 2px solid orange;
                    position: absolute;
                }
            }
        }
        #editorDiv {
            grid-area: code;
            & > div {
                height: 100%;
            }
        }
    </style>
</head>
<body>
<main class="slide-editor">
    <div style="background: green;grid-area: top">top</div>
    <slides-aside>
        
    </slides-aside>
    <div id="editorDiv"></div>
    <slides-preview>
        <div>
            <div>
            </div>
        </div>
    </slides-preview>
    <div style="background: pink;grid-area: bottom">bottom</div>
</main>
<script type="text/javascript" src="js/main.js"></script>
</body>
</html>
