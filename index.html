<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>heartslides</title>
    <script type="text/javascript" src="bundling/editor.bundle.js"></script>
    <script type="text/javascript" src="js/jszip.min.js"></script>
    <script type="text/javascript" src="js/dom-to-image.js"></script>
    <style>
@property --cqw {
  syntax: '<length>';
  inherits: true;
  initial-value: 1cqw;
}
@property --cqh {
  syntax: '<length>';
  inherits: true;
  initial-value: 1cqh;
}
        html, body, .slide-editor {
            width: 100%;
            height: 100%;
            margin: 0;
        }
        .slide-editor {
            display: grid;
            grid-template:
                "top top top top" 32px
                "slides code preview preview" 1fr
                "slides code preview preview" 1fr
                "bottom bottom bottom bottom" 32px / 136px 50% auto 100px;
        }
        slides-aside {
            grid-area: slides;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        slides-preview {
            border: 1px solid #EEE;
            container-type: inline-size;
            grid-area: preview;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: clip;
            & > div {
                --cqw: 100cqw;
                --cqh: 100cqh;
                width: 0px;
                height: 0px;
                flex-grow: 0;
                & > div {
                    display: flex;
                    width: 768px;
                    height: 432px;
                    translate: -50% -50%;
                    scale: calc((tan(atan2(var(--cqw), 1px)) - 32) / 768);
                    outline: 2px solid orange;
                    position: absolute;
                    overflow: clip;
                    & > .global {
                        display: none;
                    }
                    & > .body {
                        display: inline-block;
                        flex-grow: 1;
                        /* width: 768px;  */
                        /* height: 432px; */
                    }
                }
            }
        }
        slide-list-item, slide-list-add {
            background-size: cover;
            cursor: pointer;
            display: flex;
            outline: 2px solid #888;
            gap: 2px;
            width: 128px;
            height: 72px;
            margin-top: 8px;
            color: #000;
            text-shadow: 1px 1px #FFF;
            &:first-child {
                height: 1lh;
            }
            &:is(slide-list-add) {
               text-align: center;
               align-content: center;
               height: 2lh
            }
            &:hover {
                background-color: #8884;
            }
            &.selected {
                background-color: #88F2;
                outline-color: #88F;
            }
            &:not(:hover) {
                slide-list-action { display:none; }
            }
            slide-list-action {
                background: #FFF;
                &:hover {
                    background: #EEE;
                }
                &:first-child {
                    margin-left: auto;
                }
                align-self: end;
                display: block;
                width: 16px;
                height: 16px;
                border: 1px solid;
                text-align: center;
            }
        }
        #editorDiv {
            grid-area: code;
            & > div {
                height: 100%;
            }
        }
        [data-code-selected] {
            /* rebeccapurple  */
            outline: 1px solid #00ff76;
            background: rgb(from #00ff76 r g b / 0.2);
        }
        [data-code-hover-highlight] {
            outline: 1px solid hotpink;
            background: rgb(from hotpink r g b / 0.2);
        }
        /* note: this currently needs polyfill for firefox */
        [data-abs-x] {
            position: absolute;
            left: attr(data-abs-x px);
        }
        [data-abs-y] {
            position: absolute;
            top: attr(data-abs-y px);
        }
        [data-abs-s] {
            scale: attr(data-abs-s %);
        }
        [data-abs-r] {
            rotate: attr(data-abs-r deg);
        }
        .starting-style {
            transition: none!important;
        }

        body.presenting {
            .slide-editor {
                display: grid;
                grid-template:
                    "preview" 1fr / 1fr;
                &>:not(slides-preview) {
                    display: none;
                }
                slides-preview {
                    border: none;
                    & > div > div {
                        scale: min(calc((tan(atan2(var(--cqw), 1px))) / 768), calc((tan(atan2(var(--cqh), 1px))) / 432));
                        outline: none;
                    }
                }
            }
        }
    </style>
</head>
<body>
<main class="slide-editor">
    <div style="background: green;grid-area: top">top</div>
    <slides-aside>
        
    </slides-aside>
    <div id="editorDiv"></div>
    <slides-preview>
        <div>
            <div>
                <span class="global"></span>
                <div class="body">
                </div>
            </div>
        </div>
    </slides-preview>
    <div style="background: pink;grid-area: bottom">bottom</div>
</main>
<script type="text/javascript" src="js/main.js"></script>
</body>
</html>
