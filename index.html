<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>heartslides</title>
    <script type="text/javascript" src="bundling/editor.bundle.js"></script>
    <script type="text/javascript" src="js/jszip.min.js"></script>
    <style>
@property --cqw {
  syntax: '<length>';
  inherits: true;
  initial-value: 1cqw;
}
@property --cqh {
  syntax: '<length>';
  inherits: true;
  initial-value: 1cqh;
}
        html, body, .slide-editor {
            width: 100%;
            height: 100%;
            margin: 0;
        }
        .slide-editor {
            display: grid;
            grid-template:
                "top top top top" 32px
                "slides code preview preview" 1fr
                "bottom bottom bottom bottom" 32px / 136px 40% auto 100px;
        }
        slides-aside {
            grid-area: slides;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        slides-preview {
            border: 1px solid #EEE;
            container-type: inline-size;
            grid-area: preview;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: clip;
            & > div {
                --cqw: 100cqw;
                width: 0px;
                height: 0px;
                flex-grow: 0;
                & > div {
                    width: 768px;
                    height: 432px;
                    translate: -50% -50%;
                    scale: calc((tan(atan2(var(--cqw), 1px)) - 32) / 768);
                    outline: 2px solid orange;
                    position: absolute;
                    overflow: clip;
                    & > .body {
                        display: inline-block;
                        width: 768px;
                        height: 432px;
                    }
                }
            }
        }
        slide-list-item {
            cursor: pointer;
            display: block;
            outline: 2px solid #888;
            width: 128px;
            height: 72px;
            margin-top: 8px;
            &:hover {
                background: #8884;
            }
            &.selected {
                background: #88F2;
                outline-color: #88F;
            }
        }
        #editorDiv {
            grid-area: code;
            & > div {
                height: 100%;
            }
        }
        [data-code-selected] {
            outline: 1px solid rebeccapurple;
            background: rgb(from rebeccapurple r g b / 0.2);
        }
        [data-code-hover-highlight] {
            outline: 1px solid hotpink;
            background: rgb(from hotpink r g b / 0.2);
        }
        /* note: this currently needs polyfill for firefox */
        [data-abs-x] {
            position: absolute;
            left: attr(data-abs-x px);
        }
        [data-abs-y] {
            position: absolute;
            top: attr(data-abs-y px);
        }
    </style>
</head>
<body>
<main class="slide-editor">
    <div style="background: green;grid-area: top">top</div>
    <slides-aside>
        
    </slides-aside>
    <div id="editorDiv"></div>
    <slides-preview>
        <div>
            <div>
                <div class="body">
                </div>
            </div>
        </div>
    </slides-preview>
    <div style="background: pink;grid-area: bottom">bottom</div>
</main>
<script type="text/javascript" src="js/main.js"></script>
</body>
</html>
